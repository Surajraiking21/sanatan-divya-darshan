name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Install SVG converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin

      - name: Apply branded Android icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          rsvg-convert -w 512 -h 512 public/app-icon.svg -o android/app/src/main/res/drawable/ic_launcher.png
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_launcher"')
          s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/ic_launcher"')
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon --stacktrace assembleDebug && exit 0
            echo "Gradle debug build attempt $attempt failed; retrying..."
            sleep 15
          done
          exit 1

      - name: Build release AAB
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon --stacktrace bundleRelease && exit 0
            echo "Gradle release build attempt $attempt failed; retrying..."
            sleep 15
          done
          exit 1

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: sanatan-divya-darshan-android
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
